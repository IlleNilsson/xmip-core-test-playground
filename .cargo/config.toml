# Every test here opens sockets on loopback and files on one disk, and the
# harsh tests drive four pairs at once with mebibytes on the wire. All of
# them at once, one per core, is contention the latency judgements cannot
# tell from a fault; four at a time keeps a busy box from reading as a
# broken one (2026-09-10).
[env]
RUST_TEST_THREADS = "4"

# What a test's roll, cluster and node processes audit (ADR-0062) goes to
# target/audit, never to .local-work/audit or the operating system's log;
# forced, because a session the estate's tooling opened already names
# .local-work/audit. The images Start-XmipTest runs are started by it, not
# by cargo, and audit where the tooling says.
XMIP_AUDIT_DIRECTORY = { value = "target/audit", relative = true, force = true }
