# The Playground's RoundTrip test as an Xmip Application (ADR-0064): a pair
# arrives at a node that declared receive, is published at a node that
# declared process, and each of these Subscriptions picks up the pairs of its
# family of content contracts and routes them to the send stage. A node that
# declared process binds this Application as a real node binds one, and an
# operator pauses and resumes these Subscriptions in the Subscriptions view
# (ADR-0013, amendment 2026-09-30). They are added and removed here, in this
# file, and nowhere else.
[application]
name = "RoundTrip"

[[receive_locations]]
name = "RoundTripIn"

[[send_ports]]
name = "RoundTripOut"

# Structured documents: JSON, XML and what is written in either.
[[subscriptions]]
id = "structured"
destination = { send-port = "RoundTripOut" }
filter = "MessageType in ('json', 'xml', 'html', 'fhir', 'schematron')"

# Interchanges between trading Parties and in care.
[[subscriptions]]
id = "edi"
destination = { send-port = "RoundTripOut" }
filter = "MessageType in ('edi-edifact', 'edi-x12', 'hl7-v2')"

# Records and lines: text a reader splits.
[[subscriptions]]
id = "flat"
destination = { send-port = "RoundTripOut" }
filter = "MessageType in ('bytes', 'text', 'csv', 'fixed-width', 'regex', 'sql')"

# Schemas and the formats they describe.
[[subscriptions]]
id = "schema"
destination = { send-port = "RoundTripOut" }
filter = "MessageType in ('avro', 'protobuf', 'graphql-schema', 'wsdl', 'openapi', 'asyncapi')"
